<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz día Rami ❤️💙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff4d4d 0%, #66ccff 100%);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
        }
        .card {
            background: rgba(255,255,255,0.92);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 420px;
            width: 100%;
        }
        h1 { color: #e62e2e; font-size: 28px; margin-bottom: 12px; }
        h2 { color: #0099cc; font-size: 20px; margin-bottom: 30px; font-weight: 500; }
        .bouquet { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 25px 0; }
        .flower { font-size: 40px; }
        .message { font-size: 18px; color: #333; line-height: 1.8; margin-top: 20px; }
        .signature { margin-top: 25px; font-size: 16px; color: #666; }
        .heart { color: #ff4d4d; font-size: 22px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Feliz día Rami ❤️💙</h1>
        <h2>Que sigas cumpliendo tus sueños ✨</h2>
        <div class="bouquet">
            <span class="flower">🌸</span><span class="flower">🎤</span><span class="flower">🌸</span>
            <span class="flower">⭐</span><span class="flower">🌸</span><span class="flower">🎤</span>
            <span class="flower">🌸</span><span class="flower">💫</span><span class="flower">🌸</span>
        </div>
        <div class="message">
            Para ti, Rami 🌸<br>
            Que cada día te acerques más<br>
            a todo lo que sueñas lograr.<br>
            ¡Tú puedes con todo! 💪❤️💙
        </div>
        <div class="signature">Con todo el cariño del mundo <span class="heart">❤️</span></div>
    </div>
</body>
</html>
